[package]
name = "aoc-2025-rust"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "aoc"
path = "src/main.rs"

[[bin]]
name = "setup"
path = "utils/setup.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
colored = "3.0.0"
regex = "1.12.2"
rstest = "0.26.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
z3 = { version = "0.19.6", features = ["gh-release"] }
